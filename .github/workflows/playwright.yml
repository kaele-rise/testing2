name: Playwright Tests

# Когда запускать тесты?
on:
  push:
    branches: [ main, master, release_03_11_26 ] # Добавьте сюда ваши основные ветки
  pull_request:
    branches: [ main, master, release_03_11_26 ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из репозитория
    - uses: actions/checkout@v4

    # 2. Устанавливаем Node.js (LTS версию)
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm' # Ускоряет установку зависимостей при повторных запусках

    # 3. Устанавливаем зависимости проекта
    - name: Install dependencies
      run: npm ci

    # 4. Устанавливаем браузеры Playwright и системные зависимости для Ubuntu
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    # 5. Запускаем тесты
    - name: Run Playwright tests
      run: npx playwright test

    # 6. Сохраняем HTML-отчет как артефакт (даже если тесты упали)
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
